name: Release

on:
  push:
    tags:
      # Bare semver tags: 1.2.3, 1.2.3-rc.1, etc.
      - "[0-9]*.[0-9]*.[0-9]*"
  # Manual trigger to exercise the build without publishing: artifacts land on
  # the Actions run, and the `release` job is gated to tag pushes only.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── One static musl binary per arch ────────────────────────────────────────
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    # See container.yml: aarch64 musl on the arm runner needs musl-gcc as the
    # C compiler and linker. Target-scoped, so inert for the x86_64 job.
    env:
      CC_aarch64_unknown_linux_musl: musl-gcc
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools musl-dev

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          STAGE=coresplitter-${{ github.ref_name }}-${{ matrix.target }}
          mkdir -p "$STAGE"
          cp target/${{ matrix.target }}/release/coresplitter "$STAGE/"
          strip "$STAGE/coresplitter"
          cp README.md LICENSE "$STAGE/"
          tar -czf "$STAGE.tar.gz" "$STAGE"
          echo "ARCHIVE=$STAGE.tar.gz" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          name: coresplitter-${{ matrix.target }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error

  # ── Create the GitHub Release and attach the archives ──────────────────────
  release:
    name: GitHub Release
    needs: [build]
    # Only publish on a real tag push; workflow_dispatch skips this job.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: artifacts/*
